<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Guardian OS — Desktop Security & Telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shell.css?v=0.5.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1418'/%3E%3Cpath d='M16 4 6 8v8c0 6 4 10 10 12 6-2 10-6 10-12V8z' fill='none' stroke='%2310b981' stroke-width='2'/%3E%3Cpath d='M11 15l4 4 7-8' fill='none' stroke='%2310b981' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>

<div id="shell">
  <!-- Floating Glass Top Navigation Frame -->
  <header id="panel" role="banner">
    <div class="brand">
      <button id="menuBtn" class="brand-btn" title="Command Palette & System Utilities (Ctrl+K)" aria-label="Applications menu">
        <span class="icon-frame xs cyan brand-icon-frame">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        </span>
        <span class="brand-prompt">root@guardian:~#</span>
        <span class="brand-text">GUARDIAN-OS</span>
        <kbd class="brand-kbd">Ctrl+K</kbd>
      </button>
    </div>

    <!-- Friendly Status Banner Pill -->
    <div id="banner" role="status"></div>

    <!-- Center Workspace / Window Switcher Tabs -->
    <nav id="workspaces" class="segmented-control" aria-label="Open windows"></nav>

    <div class="panel-spacer"></div>

    <!-- Right Tray: Live Metric Pills & Clock -->
    <div id="tray">
      <div class="tray-pill" id="tCpuPill" title="Live CPU Usage">
        <span class="tray-icon-wrap cyan">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
            <rect x="9" y="9" width="6" height="6"/>
            <line x1="9" y1="1" x2="9" y2="4"/>
            <line x1="15" y1="1" x2="15" y2="4"/>
            <line x1="9" y1="20" x2="9" y2="23"/>
            <line x1="15" y1="20" x2="15" y2="23"/>
            <line x1="20" y1="9" x2="23" y2="9"/>
            <line x1="20" y1="14" x2="23" y2="14"/>
            <line x1="1" y1="9" x2="4" y2="9"/>
            <line x1="1" y1="14" x2="4" y2="14"/>
          </svg>
        </span>
        <span id="tCpu">CPU --%</span>
      </div>
      <div class="tray-pill" id="tMemPill" title="Live Memory Usage">
        <span class="tray-icon-wrap amber">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="6" y1="9" x2="6" y2="15"/>
            <line x1="10" y1="9" x2="10" y2="15"/>
            <line x1="14" y1="9" x2="14" y2="15"/>
            <line x1="18" y1="9" x2="18" y2="15"/>
          </svg>
        </span>
        <span id="tMem">RAM --%</span>
      </div>
      <div class="tray-pill" id="tSrcPill" title="Active Sensor Shields">
        <span class="tray-icon-wrap emerald">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </span>
        <span id="tSrc">Shields --</span>
      </div>
      <div class="tray-pill" id="tThreadsPill" title="1-Click OS Concurrency & IPC Live View (Viva Demo)" style="cursor:pointer;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.3);color:#38bdf8;font-weight:600">
        <span class="tray-icon-wrap cyan">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </span>
        <span id="tThreads">Concurrency & IPC</span>
      </div>
      <div class="tray-user-chip" title="Operator Terminal Identity">
        <span class="tray-icon-wrap cyan">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span id="tUser" class="tray-user"></span>
      </div>
      <div class="tray-pill" id="tTermHotkey" title="Open Linux Terminal (Ctrl+Alt+T)" style="cursor:pointer;font-family:var(--font-mono);font-size:11px">
        <span class="tray-icon-wrap cyan">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        </span>
        <span style="color:var(--primary);font-weight:600">Ctrl+Alt+T</span>
      </div>
      <div class="tray-pill tray-clock-pill" title="System Local Clock">
        <span class="tray-icon-wrap slate">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </span>
        <span id="clock" class="tray-clock" aria-label="Clock"></span>
      </div>
      <button id="themeBtn" class="theme-btn icon-frame xs slate" title="Toggle Theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Left Floating Dock Frame -->
  <aside id="dock" aria-label="Application dock"></aside>

  <!-- Desktop Workstation Area -->
  <main id="desktop">
    <div id="desktopGlow"></div>
    <div id="windows"></div>
    <div id="desktopWatermark" class="desktop-watermark">
      <span><span class="desktop-watermark-dot"></span> GUARDIAN-OS v0.3.0</span>
      <span>RING-0 TELEMETRY</span>
      <span>PRODUCER-CONSUMER IPC</span>
      <span>ARCH: AMD64</span>
    </div>
  </main>

  <!-- Hidden compatibility hooks for existing script bindings -->
  <div id="tmux" style="display:none !important;" aria-hidden="true">
    <span id="tmuxL"></span><span id="tmuxR"></span>
  </div>

  <!-- Command Palette Modal -->
  <div id="palette" class="hidden" hidden role="dialog" aria-label="Command palette" style="display:none !important">
    <div class="pal-box">
      <div class="pal-search-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="palIn" placeholder="Search applications, OS tools, or guardian commands..." autocomplete="off" spellcheck="false">
        <button id="palCloseBtn" class="pal-close-btn" type="button" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
        <kbd class="pal-kbd" role="button" title="Close Command Palette (Esc)">ESC</kbd>
      </div>
      <ul id="palList"></ul>
    </div>
  </div>

  <!-- Toast Notification Center -->
  <div id="toasts" aria-live="polite"></div>
</div>

<script src="js/core.js?v=0.5.0"></script>
<script src="js/wm.js?v=0.5.0"></script>
<script src="js/apps-home.js?v=0.5.0"></script>
<script src="js/apps-threads.js?v=0.5.0"></script>
<script src="js/apps-terminal.js?v=0.5.0"></script>
<script src="js/apps-proc.js?v=0.5.0"></script>
<script src="js/apps-sec.js?v=0.5.0"></script>
<script src="js/apps-misc.js?v=0.5.0"></script>
<script src="js/main.js?v=0.5.0"></script>
</body>
</html>
